<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azverse</title>
<style>
  :root {
    --chartreuse: #D4FF28;  /* primary */
    --orchid: #FF2DF4;      /* secondary */
    --aqua: #2BFAE9;
    --vermillion: #FF1A1A;
    --parchment: #F2EEE1;
    --ink: #1A1400;
    --malachite: #001F18;
    --aubergine: #2E0026;
    --lapis: #00122E;
    --oxblood: #2E0700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: monospace;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--lapis);
    border-left: 18px solid var(--chartreuse); /* medium border left */
    border-top: 6px solid var(--chartreuse);
    border-right: 6px solid var(--chartreuse);
    border-bottom: 6px solid var(--chartreuse);
    border-radius: 4px;
    box-sizing: border-box;
  }
  #hint {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; color: var(--chartreuse);
    text-shadow: 0 0 6px #000;
    pointer-events: none; min-height: 18px;
    background: rgba(26,20,0,0.65);
    padding: 4px 12px;
    border-radius: 4px;
    z-index: 20;
  }
  #hud {
    position: fixed;
    top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px;
    font-size: 13px; color: var(--parchment);
    gap: 12px;
    z-index: 30;
    pointer-events: none;
  }
  #hud .left { display: flex; align-items: center; gap: 8px; }
  #hud b { color: var(--chartreuse); }
  #hud img.logo { height: 22px; }
  #progress {
    position: fixed;
    bottom: 0; left: 18px; right: 6px;
    height: 4px; background: var(--oxblood);
    z-index: 30;
  }
  #progress i { display: block; height: 100%; width: 0%; background: var(--chartreuse); transition: width .3s; }

  /* ---- touch controls (mobile only) ---- */
  #touch-controls {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    display: none;
  }
  #touch-controls .tbtn {
    position: fixed;
    pointer-events: auto;
    touch-action: none;
    background: rgba(26,20,0,0.72);
    border: 2px solid var(--chartreuse);
    color: var(--chartreuse);
    font-family: monospace;
    font-weight: bold;
    border-radius: 14px;
    text-shadow: 0 0 6px #000;
    box-shadow: 0 0 14px rgba(212,255,40,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  #touch-controls .tbtn:active {
    background: var(--chartreuse);
    color: var(--ink);
  }
  #btn-left  { left: 14px;  bottom: 18px; width: 96px;  height: 96px;  font-size: 40px; }
  #btn-right { right: 14px; bottom: 18px; width: 96px;  height: 96px;  font-size: 40px; }
  #btn-jump  { right: 14px; bottom: 126px; width: 76px; height: 76px;  font-size: 13px; }
  #btn-enter { left: 14px;  bottom: 126px; width: 76px; height: 76px;  font-size: 12px; }

  @media (pointer: coarse), (max-width: 820px) {
    canvas {
      border-width: 6px;
    }
    #hud { font-size: 11px; padding: 0 10px; }
    #hud img.logo { height: 16px; }
    #touch-controls { display: block; }
    #progress { left: 6px; right: 6px; }
    #hint { top: 40px; font-size: 12px; padding: 3px 10px; max-width: 92%; }
  }

  /* ---- character meet popup (light toast) ---- */
  #meet {
    position: fixed;
    top: 52px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    pointer-events: none;
  }
  #meet.hidden { display: none; }
  #meet .card {
    display: flex; align-items: center; gap: 12px;
    background: rgba(26,20,0,0.92);
    border: 1px solid var(--chartreuse);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 0 22px rgba(212,255,40,0.3);
    max-width: 94vw;
    pointer-events: auto;
    cursor: pointer;
  }
  #meet .card:hover { background: var(--aubergine); }
  #meet .who { text-align: left; min-width: 0; }
  #meet .name {
    color: var(--chartreuse); font-size: 15px; font-weight: bold; line-height: 1.2;
  }
  #meet .role {
    color: var(--parchment); font-size: 11px; opacity: 0.85;
    overflow-wrap: break-word; word-break: break-word;
  }
  #meet .cta {
    flex-shrink: 0;
    background: var(--chartreuse); color: var(--ink);
    padding: 6px 14px; border-radius: 6px;
    font-family: monospace; font-weight: bold; font-size: 13px;
  }
  #meet .card:hover .cta { background: var(--orchid); }
</style>
</head>
<body>
  <div id="hud">
    <span class="left"><img class="logo" src="assets/logo/Aztec-Symbol-Circle.svg" alt="Aztec"> <b id="street-name">AZVERSE</b></span>
    <span>Visited <b id="visited">1</b> / 11</span>
    <span>Met <b id="people">0</b> / 9</span>
  </div>
  <div id="progress"><i id="progress-bar"></i></div>
  <div id="wrap">
    <div id="hint"></div>
    <canvas id="game" width="960" height="520"></canvas>
  </div>
  <div id="touch-controls">
    <button id="btn-left" class="tbtn" aria-label="Walk left">&#9664;</button>
    <button id="btn-jump" class="tbtn" aria-label="Jump">JUMP</button>
    <button id="btn-enter" class="tbtn" aria-label="Open page">OPEN</button>
    <button id="btn-right" class="tbtn" aria-label="Walk right">&#9654;</button>
  </div>
  <div id="meet" class="hidden">
    <div class="card" id="meet-card" title="Click to open on X">
      <span class="who">
        <div class="name" id="meet-name"></div>
        <div class="role" id="meet-role"></div>
      </span>
      <span class="cta">Open on X</span>
    </div>
  </div>

<script>
( () => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, GROUND, moonX;

  function resize() {
    const BORDER_L = 18, BORDER_O = 6; // medium left, small elsewhere
    const dpr = Math.min(window.devicePixelRatio || 1, 3); // cap for perf
    W = window.innerWidth - BORDER_L - BORDER_O;
    H = window.innerHeight - BORDER_O * 2;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels, rendered sharp
    ctx.imageSmoothingEnabled = true;
    GROUND = H - 70;
    moonX = W - 90;
    if (player) {
      player.y = GROUND - player.h;
      player.x = Math.max(30, Math.min(player.x, worldW() - 30));
    }
    if (cam !== undefined) cam = Math.max(0, Math.min(cam, worldW() - W));
  }
  window.addEventListener('resize', resize);

  const hintEl = document.getElementById('hint');
  const streetNameEl = document.getElementById('street-name');
  const visitedEl = document.getElementById('visited');
  const peopleEl = document.getElementById('people');
  const meetEl = document.getElementById('meet');
  const meetNameEl = document.getElementById('meet-name');
  const meetRoleEl = document.getElementById('meet-role');
  const meetCardEl = document.getElementById('meet-card');
  let meetShown = null;
  let meetUrl = '';

  // ---------- world / categories ----------
  const CATS = [
    { id: 'general',    name: 'General',               emoji: '🌐', color: '#FF1A1A', links: [
      { name: 'Aztec Network',       url: 'https://aztec.network/',                        },
      { name: 'Aztec Blog',          url: 'https://aztec.network/blog',                    },
    ]},
    { id: 'community',  name: 'Community',             emoji: '🌍', color: '#2BFAE9', links: [
      { name: 'X Aztec Network',     url: 'https://x.com/aztecnetwork',                    },
      { name: 'X Aztec Labs',        url: 'https://x.com/AztecLabs_',                      },
      { name: 'X Aztec Foundation',  url: 'https://x.com/aztecFND',                        },
      { name: 'X Aztec Dev',         url: 'https://x.com/Aztec_Dev',                       },
      { name: 'YouTube',             url: 'https://www.youtube.com/channel/UCyr94cC0lyNJkyCmmLwbh7A', },
    ]},
    { id: 'developers', name: 'Developers',            emoji: '👩‍💻', color: '#CC24C3', links: [
      { name: 'Aztec Docs',          url: 'https://docs.aztec.network/',                   },
      { name: 'Awesome-Aztec',       url: 'https://github.com/AztecProtocol/awesome-aztec', },
      { name: 'Github Starter',      url: 'https://github.com/AztecProtocol/aztec-starter', },
    ]},
    { id: 'governance', name: 'Governance',            emoji: '🏛️', color: '#FF2DF4', links: [
      { name: 'AZIPs / Governance',  url: 'https://github.com/AztecProtocol/governance',   },
      { name: 'Governance Dashboard',url: 'https://aztecgov.nethermind.io/',               },
      { name: 'Forum',               url: 'https://forum.aztec.network/',                  },
    ]},
    { id: 'sequencers', name: 'Sequencers & Network',  emoji: '⚙️', color: '#19958C', links: [
      { name: 'Aztec Staking',       url: 'https://stake.aztec.network/',                  },
      { name: 'Dashtec',             url: 'https://dashtec.xyz/',                          },
      { name: 'Aztec Vision',        url: 'https://aztec.vision/',                         },
      { name: 'AztecScan',           url: 'https://aztecscan.xyz/',                        },
    ]},
  ];

  // main street = one building per category + Meet The Team
  const TEAM_CAT = { id: 'team', name: 'Meet The Team', emoji: '🤝', color: '#FF6AEA', links: [] };
  const MAIN_BUILDINGS = [];
  (function () {
    let x = 260;
    CATS.forEach(c => {
      MAIN_BUILDINGS.push({ kind: 'cat', id: c.id, name: c.emoji + ' ' + c.name, color: c.color, x, width: 300 });
      x += 500;
    });
    MAIN_BUILDINGS.push({ kind: 'cat', id: 'team', name: TEAM_CAT.emoji + ' ' + TEAM_CAT.name, color: TEAM_CAT.color, x, width: 300 });
  })();

  function catById(id) {
    return CATS.find(c => c.id === id) || (id === 'team' ? TEAM_CAT : null);
  }

  // sub street per category: EXIT first, then its links
  const SUB_CACHE = {};
  function subBuild(cat) {
    const bs = [];
    bs.push({ kind: 'exit', id: 'exit', name: '⬅ EXIT', color: '#564D3F', x: 300, width: 240 });
    if (cat.id === 'team') return bs; // characters stand in this street instead
    let x = 650;
    cat.links.forEach((l, i) => {
      bs.push({ kind: 'link', id: 'link' + i, name: l.name, color: cat.color, x, width: 280, url: l.url });
      x += 480;
    });
    return bs;
  }
  function streetFor(cat) {
    if (!cat) return { id: 'main', isMain: true, name: 'AZVERSE', color: '#1A1400', buildings: MAIN_BUILDINGS };
    return { id: cat.id, isMain: false, name: cat.emoji + ' ' + cat.name, color: cat.color, buildings: (SUB_CACHE[cat.id] || (SUB_CACHE[cat.id] = subBuild(cat))) };
  }
  let street = streetFor(null);
  let returnX = 0;
  function currentBuildings() { return street.buildings; }
  function worldW() {
    if (street.id === 'team') {
      const lastP = PEOPLE[PEOPLE.length - 1];
      return Math.max(3500, lastP.x + 150);
    }
    const bs = currentBuildings();
    const last = bs[bs.length - 1];
    return Math.max(3500, last.x + last.width + 150);
  }
  const TOTAL_SITES = (CATS.length + 1) + CATS.reduce((t, c) => t + c.links.length, 0);
  const visitedIds = new Set();

  // ---------- characters (team) ----------
  const PEOPLE = [
    { name: 'Zac',               x: 680,  color: '#FF1A1A', role: 'President & Co-founder, Aztec Foundation', url: 'https://x.com/Zac_Aztec',           met: false },
    { name: 'Joe',               x: 1010, color: '#FF2DF4', role: 'CEO, Aztec Labs',                            url: 'https://x.com/jaosef',               met: false },
    { name: 'Arnaud',            x: 1340, color: '#2BFAE9', role: 'CEO, Aztec Foundation',                      url: 'https://x.com/Arnaudschenk',         met: false },
    { name: 'Josh',              x: 1670, color: '#A9CC1F', role: 'Head of Devrel',                             url: 'https://x.com/critesjosh_',          met: false },
    { name: 'Amin',              x: 2000, color: '#CC24C3', role: 'Product, Decentralization',                 url: 'https://x.com/Amin_3X',              met: false },
    { name: 'Savio',             x: 2330, color: '#19958C', role: 'Product, Noir',                             url: 'https://x.com/Savio_Sou_',           met: false },
    { name: 'David',             x: 2660, color: '#335380', role: 'Product Marketing',                         url: 'https://x.com/DavidSteinrueck',      met: false },
    { name: 'ItsTymo',           x: 2990, color: '#FF6AEA', role: 'Social Media Manager',                      url: 'https://x.com/ItsTymo',              met: false },
    { name: 'Ciara Nightingale', x: 3320, color: '#564D3F', role: 'Technical Educator',                        url: 'https://x.com/CiaraNightingal',      met: false },
  ];
  const PEOPLE_COUNT = PEOPLE.length;

  // ---------- backdrop images (Aztec brand photography) ----------
  const BG_COUNT = 30;
  const bgImages = [];
  let bgLoaded = 0, bgCur = 0, bgNext = 0;
  let bgFade = 1; // 1 = fully showing current
  const BG_SWITCH = 12; // seconds per image
  let bgTimer = BG_SWITCH;

  const logoImg = new Image();
  logoImg.src = 'assets/logo/Aztec-Symbol-Circle.svg';

  function loadBackdrops() {
    for (let i = 1; i <= BG_COUNT; i++) {
      const im = new Image();
      im.onload = () => { bgLoaded++; updateProgress(); };
      im.onerror = () => { bgLoaded++; updateProgress(); };
      im.src = 'assets/bg/img_' + String(i).padStart(2, '0') + '.jpg';
      bgImages.push(im);
    }
  }
  function updateProgress() {
    const bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = Math.round(bgLoaded / BG_COUNT * 100) + '%';
    if (bgLoaded >= BG_COUNT) hintEl.textContent = 'Welcome to Azverse — walk right to explore the site';
  }

  // ---------- state ----------
  let player, cam, keys, paused, minimap;
  let lastTime = 0;

  function reset() {
    player = {
      x: currentBuildings()[0].x + currentBuildings()[0].width / 2,
      y: GROUND - 34,
      vx: 0, vy: 0, w: 22, h: 44,
      facing: 1, walkPhase: 0, grounded: true,
    };
    cam = 0;
    keys = {};
    paused = false;
    minimap = true;
    currentBuildings().forEach(s => visitedIds.delete(s.id));
    PEOPLE.forEach(p => p.met = false);
    updateHUD();
  }

  function updateHUD() {
    const n = visitedIds.size;
    const m = PEOPLE.filter(p => p.met).length;
    visitedEl.textContent = n + ' / ' + TOTAL_SITES;
    peopleEl.textContent = m + ' / ' + PEOPLE_COUNT;
    streetNameEl.textContent = street.isMain ? 'AZVERSE' : street.name;
  }

  // ---------- input ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    keys[k] = true;
    if (k === 'Enter') { e.preventDefault(); tryEnter(); }
    if (k === 'p' || k === 'P') { paused = !paused; hintEl.textContent = paused ? 'PAUSED' : ''; }
    if (k === 'm' || k === 'M') { minimap = !minimap; }
    if (k === ' ' || k === 'Space') {
      e.preventDefault();
      if (player.grounded) { player.vy = -9.5; player.grounded = false; }
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // ---------- touch controls (mobile) ----------
  function bindHold(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, { passive: false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); keys[key] = false; }, { passive: false });
    el.addEventListener('touchcancel',() => { keys[key] = false; });
    el.addEventListener('mousedown', () => { keys[key] = true; });
    el.addEventListener('mouseup',   () => { keys[key] = false; });
    el.addEventListener('mouseleave',() => { keys[key] = false; });
  }
  bindHold('btn-left', 'ArrowLeft');
  bindHold('btn-right', 'ArrowRight');

  function bindTap(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.preventDefault(); fn(); });
  }
  bindTap('btn-jump', () => {
    if (player.grounded) { player.vy = -9.5; player.grounded = false; }
  });
  bindTap('btn-enter', () => tryEnter());

  function tryEnter() {
    const p = personAt(player.x);
    if (p) { showMeet(p); return; }
    const b = buildingAt(player.x);
    if (!b) { hintEl.textContent = 'Nothing here... walk to a building door.'; return; }
    if (b.kind === 'exit') {
      exitStreet();
    } else if (b.kind === 'cat') {
      enterCategory(b);
    } else if (b.kind === 'link') {
      openUrl(b.url);
    }
  }

  function enterCategory(b) {
    const cat = catById(b.id);
    // remember where we came from so EXIT brings us back there
    returnX = b.x + b.width / 2;
    street = streetFor(cat);
    visitedIds.add(b.id);
    updateHUD();
    // start exactly at the exit building's door
    const exit = street.buildings.find(x => x.kind === 'exit');
    player.x = exit ? exit.x + exit.width / 2 : 130;
    player.facing = 1;
    cam = 0;
    hintEl.textContent = 'Inside ' + street.name + ' — the EXIT building returns to the main street';
  }

  function exitStreet() {
    street = streetFor(null);
    updateHUD();
    // go back to the same building you entered from
    player.x = returnX || (MAIN_BUILDINGS[0].x + MAIN_BUILDINGS[0].width / 2);
    player.facing = 1;
    cam = 0;
    hintEl.textContent = 'Back on the main street — walk to a building door';
  }

  function openUrl(url) {
    hintEl.textContent = 'Opening ' + url + ' in a new tab...';
    window.open(url, '_blank', 'noopener');
  }

  function personAt(x) {
    if (street.id !== 'team') return null;
    return PEOPLE.find(p => Math.abs(x - p.x) < 40) || null;
  }

  function showMeet(p) {
    p.met = true;
    meetShown = p;
    meetUrl = p.url;
    meetNameEl.textContent = p.name;
    meetRoleEl.textContent = p.role;
    meetEl.classList.remove('hidden');
    updateHUD();
  }
  meetCardEl.addEventListener('click', () => {
    if (meetUrl) window.open(meetUrl, '_blank', 'noopener');
    meetEl.classList.add('hidden');
    meetShown = null;
  });

  // ---------- helpers ----------
  function buildingAt(x) {
    return currentBuildings().find(b => Math.abs(x - (b.x + b.width / 2)) < b.width / 2 + 6) || null;
  }

  function nearDoor(s) {
    const doorX = s.x + s.width / 2;
    return Math.abs(player.x - doorX) < 26 && player.grounded;
  }

  // ---------- update ----------
  function update(dt) {
    const accel = 0.55, maxSpeed = 4.2;
    let dir = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dir += 1;
    if (dir !== 0) { player.facing = dir; player.walkPhase += dt * 12; }

    player.vx += dir * accel;
    player.vx *= 0.82;
    if (Math.abs(player.vx) > maxSpeed) player.vx = Math.sign(player.vx) * maxSpeed;
    player.x += player.vx;
    player.y += player.vy;
    player.vy += 0.45;

    if (player.x < 30) { player.x = 30; player.vx = 0; }
    if (player.x > worldW() - 30) { player.x = worldW() - 30; player.vx = 0; }

    if (player.y >= GROUND - player.h) {
      player.y = GROUND - player.h;
      player.vy = 0;
      player.grounded = true;
    } else {
      player.grounded = false;
    }

    // camera
    const target = player.x - W * 0.42;
    cam += (target - cam) * 0.08;
    cam = Math.max(0, Math.min(cam, worldW() - W));

    // door hint
    const b = buildingAt(player.x);
    if (b && nearDoor(b)) {
      hintEl.textContent =
        b.kind === 'exit' ? 'Press ENTER to go back to the main street' :
        b.kind === 'link' ? 'Press ENTER to open ' + b.url :
        'Press ENTER to enter ' + ((CATS.find(c => c.id === b.id) || {}).name || '');
    } else {
      hintEl.textContent = '';
    }

    // auto-meet characters
    const p = personAt(player.x);
    if (p && !meetShown && meetEl.classList.contains('hidden')) {
      showMeet(p);
    } else if (!p && meetShown) {
      meetEl.classList.add('hidden');
      meetShown = null;
    }
  }

  // ---------- drawing ----------
  function drawBackdrop() {
    const cur = bgImages[bgCur];
    const nxt = bgImages[bgNext];
    if (cur && cur.complete && cur.naturalWidth) {
      // cover-fit current image
      ctx.globalAlpha = 1;
      drawCover(cur, 0);
      if (nxt && nxt !== cur && nxt.complete && nxt.naturalWidth && bgFade < 1) {
        ctx.globalAlpha = 1 - bgFade;
        drawCover(nxt, 0);
      }
      ctx.globalAlpha = 1;
    } else {
      // fallback gradient while loading
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0d22');
      g.addColorStop(1, '#1c254a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    // brand tint: chartreuse-on-ink wash so the street stays readable
    ctx.fillStyle = 'rgba(26,20,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    // vignette at bottom for street legibility
    const vg = ctx.createLinearGradient(0, GROUND - 160, 0, H);
    vg.addColorStop(0, 'rgba(26,20,0,0)');
    vg.addColorStop(1, 'rgba(26,20,0,0.9)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, GROUND - 160, W, H - (GROUND - 160));
  }

  function drawCover(img, offsetX) {
    const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, offsetX, (H - dh) / 2, dw, dh);
  }

  function drawSkyline(par, height, color) {
    ctx.fillStyle = color;
    let x = -((cam * par) % 140);
    for (let i = 0; i < 12; i++) {
      const bw = 60 + ((i * 53) % 70);
      const bh = height * (0.5 + ((i * 37) % 50) / 100);
      ctx.fillRect(x, GROUND - bh, bw, bh);
      x += 140;
    }
  }

  function drawBuildings() {
    for (const s of currentBuildings()) {
      const sx = s.x - cam;
      if (sx + s.width < -50 || sx > W + 50) continue;
      const height = Math.min(GROUND - 40, 240 + ((s.x * 7) % 90));
      const bottom = GROUND;
      const top = GROUND - height;
      const cx = sx + s.width / 2;

      // ---- facade with vertical gradient (theme-tinted) ----
      const grad = ctx.createLinearGradient(0, top, 0, bottom);
      const light = shade(s.color, 0.5); // lighter top
      const dark = shade(s.color, -0.55); // darker base
      grad.addColorStop(0, light);
      grad.addColorStop(0.55, s.color);
      grad.addColorStop(1, dark);
      ctx.fillStyle = grad;
      ctx.fillRect(sx, top, s.width, height);

      // ---- subtle edge highlight / shadow for depth ----
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(sx, top, 3, height);            // left highlight
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(sx + s.width - 4, top, 4, height); // right shade

      // ---- glossy roof band + cap ----
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(sx, top, s.width, 6);                       // dark cap
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.fillRect(sx, top, s.width, 2);                       // glint line
      // corner parapets
      ctx.fillStyle = dark;
      ctx.fillRect(sx, top - 8, 10, 8);
      ctx.fillRect(sx + s.width - 10, top - 8, 10, 8);

      // ---- window grid with soft glow ----
      const wyStart = top + 18;
      const wyEnd = bottom - 110;
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; // recessed wells
      for (let wy = wyStart; wy < wyEnd; wy += 30) {
        for (let wx = sx + 12; wx < sx + s.width - 16; wx += 30) {
          ctx.fillRect(wx, wy, 18, 22);
        }
      }
      ctx.fillStyle = 'rgba(212,255,40,0.30)';
      for (let wy = wyStart; wy < wyEnd; wy += 30) {
        for (let wx = sx + 12; wx < sx + s.width - 16; wx += 30) {
          if (((wx * 3 + wy) % 4) !== 0) ctx.fillRect(wx + 2, wy + 2, 14, 18);
        }
      }

      // ---- mullion lines (window cross bars) ----
      ctx.strokeStyle = 'rgba(26,20,0,0.35)';
      ctx.lineWidth = 1;
      for (let wy = wyStart + 11; wy < wyEnd; wy += 30) {
        ctx.beginPath();
        ctx.moveTo(sx + 12, wy);
        ctx.lineTo(sx + s.width - 16, wy);
        ctx.stroke();
      }

      // ---- ground-floor strip ----
      ctx.fillStyle = 'rgba(0,0,0,0.30)';
      ctx.fillRect(sx, bottom - 70, s.width, 70);

      // ---- neon sign ----
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      const hasLogo = s.kind === 'cat' && s.id === CATS[0].id && logoImg.complete && logoImg.naturalWidth;
      const txtW = ctx.measureText(s.name).width;
      const sw = Math.min(s.width - 12, Math.max(60, txtW + (hasLogo ? 44 : 26)));
      const sh = 26;
      ctx.save();
      ctx.shadowColor = '#D4FF28';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(26,20,0,0.92)';
      ctx.fillRect(cx - sw / 2, top + 10, sw, sh);
      ctx.restore();
      ctx.strokeStyle = 'rgba(212,255,40,0.85)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - sw / 2, top + 10, sw, sh);
      ctx.fillStyle = '#D4FF28';
      // show a small logo on the first (home-ish) building
      if (hasLogo) {
        ctx.drawImage(logoImg, cx - sw / 2 + 5, top + 13, 20, 20);
        ctx.fillText(s.name, cx + 16, top + 27);
      } else {
        ctx.fillText(s.name, cx, top + 27);
      }

      // ---- entrance: recessed glowing doorway ----
      const dw = Math.min(40, s.width * 0.22);
      const dx = cx;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(dx - dw / 2, bottom - 78, dw, 78);
      ctx.fillStyle = s.color;
      ctx.fillRect(dx - dw / 2 + 4, bottom - 74, dw - 8, 74);
      // door frame glint
      ctx.strokeStyle = 'rgba(212,255,40,0.7)';
      ctx.lineWidth = 1;
      ctx.strokeRect(dx - dw / 2 + 4, bottom - 74, dw - 8, 74);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(dx - dw / 2 + 4, bottom - 74, dw - 8, 10);

      // lamp above door
      if (visitedIds.has(s.id)) {
        ctx.save();
        ctx.fillStyle = '#D4FF28';
        ctx.shadowColor = '#D4FF28';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(dx, bottom - 86, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#2E0700';
        ctx.fillRect(dx - 3, bottom - 88, 6, 5);
        ctx.fillStyle = 'rgba(212,255,40,0.35)';
        ctx.fillRect(dx - 1.5, bottom - 86, 3, 3);
      }

      // ---- awning above entrance ----
      ctx.fillStyle = 'rgba(26,20,0,0.65)';
      ctx.beginPath();
      ctx.moveTo(dx - dw / 2 - 8, bottom - 80);
      ctx.lineTo(dx + dw / 2 + 8, bottom - 80);
      ctx.lineTo(dx + dw / 2 + 3, bottom - 70);
      ctx.lineTo(dx - dw / 2 - 3, bottom - 70);
      ctx.closePath();
      ctx.fill();

      ctx.textAlign = 'left';
    }
  }

  // lighten (amt>0) or darken (amt<0) a hex color
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt >= 0) {
      r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt;
    } else {
      r *= (1 + amt); g *= (1 + amt); b *= (1 + amt);
    }
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
  }

  function drawLamps() {
    ctx.fillStyle = '#2E0700';
    for (let lx = 60; lx < worldW(); lx += 220) {
      const sx = lx - cam;
      if (sx < -30 || sx > W + 30) continue;
      // tapered post
      ctx.fillStyle = '#201508';
      ctx.fillRect(sx + 2, GROUND - 112, 4, 112);
      // arm
      ctx.fillRect(sx - 2, GROUND - 112, 10, 3);
      // lamp head
      ctx.fillStyle = '#2E0700';
      ctx.beginPath();
      ctx.roundRect(sx - 5, GROUND - 122, 14, 12, 3);
      ctx.fill();
      // glowing bulb
      ctx.save();
      ctx.fillStyle = '#D4FF28';
      ctx.shadowColor = '#D4FF28';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(sx + 2, GROUND - 116, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // light pool on ground
      ctx.fillStyle = 'rgba(212,255,40,0.10)';
      ctx.beginPath();
      ctx.ellipse(sx + 2, GROUND + 2, 22, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMaskedMan() {
    const p = player;
    const px = p.x - cam;
    const py = p.y;
    const f = p.facing;
    const walk = player.grounded ? Math.sin(p.walkPhase) * 3 : 0;

    ctx.save();
    ctx.translate(px, py);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, p.h + 2, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs
    ctx.strokeStyle = '#470B00';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4, p.h - 16);
    ctx.lineTo(-4 + walk * 0.5, p.h);
    ctx.moveTo(4, p.h - 16);
    ctx.lineTo(4 - walk * 0.5, p.h);
    ctx.stroke();

    // body (dark hoodie)
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.roundRect(-p.w / 2, p.h - 40, p.w, 26, 6);
    ctx.fill();
    // hoodie pocket line
    ctx.strokeStyle = '#D4FF28';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, p.h - 18);
    ctx.lineTo(4, p.h - 18);
    ctx.stroke();

    // head under hood
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.arc(0, p.h - 44, 11, Math.PI, 0);
    ctx.fill();
    // hood peak
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.moveTo(-11, p.h - 46);
    ctx.quadraticCurveTo(0, p.h - 62, 11, p.h - 46);
    ctx.closePath();
    ctx.fill();

    // chartreuse mask
    ctx.fillStyle = '#D4FF28';
    ctx.beginPath();
    ctx.ellipse(f * 1, p.h - 45, 8.5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // eye holes
    ctx.fillStyle = '#1A1400';
    ctx.beginPath();
    ctx.ellipse(f * 3, p.h - 46, 3.4, 4.4, f * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(f * -2, p.h - 46, 3.4, 4.4, f * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // mask edge (chin)
    ctx.strokeStyle = '#E1FF8C';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(f * 1, p.h - 44, 8.5, 0.3, Math.PI - 0.3);
    ctx.stroke();

    ctx.restore();
  }

  function drawCharacter(p) {
    const sx = p.x - cam;
    if (sx < -60 || sx > W + 60) return;
    const h = 44, w = 22;

    ctx.save();
    ctx.translate(sx, GROUND - h);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, h + 2, 15, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs
    ctx.strokeStyle = '#1A1400';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-3, h - 16); ctx.lineTo(-3, h);
    ctx.moveTo(3, h - 16); ctx.lineTo(3, h);
    ctx.stroke();

    // body (team color hoodie)
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(-w / 2, h - 38, w, 24, 6);
    ctx.fill();
    // pocket line
    ctx.strokeStyle = '#1A1400';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, h - 18); ctx.lineTo(4, h - 18);
    ctx.stroke();

    // head
    ctx.fillStyle = '#2E0026';
    ctx.beginPath();
    ctx.arc(0, h - 42, 10, Math.PI, 0);
    ctx.fill();
    // hood peak
    ctx.beginPath();
    ctx.moveTo(-10, h - 44);
    ctx.quadraticCurveTo(0, h - 58, 10, h - 44);
    ctx.closePath();
    ctx.fill();

    // face
    ctx.fillStyle = '#F2EEE1';
    ctx.beginPath();
    ctx.arc(0, h - 42, 6.5, 0, Math.PI * 2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#1A1400';
    ctx.beginPath();
    ctx.arc(-2.5, h - 43, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(2.5, h - 43, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // name tag + met indicator
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    const nameW = ctx.measureText(p.name).width;
    const tagC = p === meetShown ? '#D4FF28' : (p.met ? '#2BFAE9' : '#E8E2D0');
    // dark pill behind the name
    ctx.fillStyle = 'rgba(26,20,0,0.88)';
    ctx.beginPath();
    ctx.roundRect(sx - nameW / 2 - 7, GROUND - h - 26, nameW + 14, 16, 4);
    ctx.fill();
    ctx.strokeStyle = tagC;
    ctx.lineWidth = 1;
    ctx.strokeRect(sx - nameW / 2 - 7, GROUND - h - 26, nameW + 14, 16);
    ctx.fillStyle = tagC;
    ctx.fillText(p.name, sx, GROUND - h - 14);
    // "!" marker when not yet met
    if (!p.met) {
      ctx.fillStyle = 'rgba(255,45,244,0.9)';
      ctx.beginPath();
      ctx.arc(sx + nameW / 2 + 12, GROUND - h - 18, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1A1400';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('!', sx + nameW / 2 + 12, GROUND - h - 14);
    }
    ctx.textAlign = 'left';
  }

  function drawCharacters() {
    if (street.id !== 'team') return;
    for (const p of PEOPLE) drawCharacter(p);
  }

  function drawStreet() {    // sidewalk
    // sidewalk with subtle texture
    ctx.fillStyle = '#3a3426';
    ctx.fillRect(0, GROUND - 5, W, 5);
    ctx.fillStyle = 'rgba(212,255,40,0.12)';
    ctx.fillRect(0, GROUND - 1, W, 2);
    // pavement
    ctx.fillStyle = '#17130b';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    // asphalt sheen gradient
    const pv = ctx.createLinearGradient(0, GROUND, 0, H);
    pv.addColorStop(0, '#241f12');
    pv.addColorStop(1, '#12100a');
    ctx.fillStyle = pv;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    // lane lines
    ctx.strokeStyle = 'rgba(212,255,40,0.22)';
    ctx.lineWidth = 3;
    ctx.setLineDash([22, 18]);
    ctx.beginPath();
    ctx.moveTo(-(cam % 40), GROUND + 32);
    ctx.lineTo(W + 40, GROUND + 32);
    ctx.stroke();
    ctx.setLineDash([]);
    // building ground shadows (soft grounding)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (const s of currentBuildings()) {
      const sx = s.x - cam;
      if (sx + s.width < -50 || sx > W + 50) continue;
      ctx.fillRect(sx + 6, GROUND, s.width - 6, 4);
    }
  }

  function drawMinimap() {
    if (!minimap) return;
    const mw = W - 40, mh = 26, mx = 20, my = H - 34;
    ctx.fillStyle = 'rgba(26,20,0,0.85)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = 'rgba(212,255,40,0.5)';
    ctx.strokeRect(mx, my, mw, mh);
    const scale = mw / worldW();
    for (const s of currentBuildings()) {
      const bx = mx + s.x * scale;
      ctx.fillStyle = visitedIds.has(s.id) ? '#D4FF28' : '#918B7F';
      ctx.beginPath();
      ctx.arc(bx, my + mh / 2, visitedIds.has(s.id) ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // team members on the team street
    if (street.id === 'team') {
      for (const p of PEOPLE) {
        const bx = mx + p.x * scale;
        ctx.fillStyle = p.met ? '#D4FF28' : '#FF2DF4';
        ctx.beginPath();
        ctx.arc(bx, my + mh / 2, p.met ? 3.5 : 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // player
    ctx.fillStyle = '#FF2DF4';
    ctx.beginPath();
    ctx.arc(mx + player.x * scale, my + mh / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    drawBackdrop();
    drawBuildings();
    drawLamps();
    drawStreet();
    drawCharacters();
    drawMaskedMan();
    drawMinimap();
  }

  // ---------- backdrop switching ----------
  function tickBackdrop(dt) {
    if (bgLoaded < 2) return;
    bgTimer -= dt;
    if (bgTimer <= 0) {
      bgTimer = BG_SWITCH;
      bgCur = bgNext;
      bgNext = (bgNext + 1) % BG_COUNT;
      bgFade = 0;
    }
    if (bgFade < 1) bgFade = Math.min(1, bgFade + dt / 1.2);
  }

  // ---------- loop ----------
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;
    tickBackdrop(dt);
    if (!paused) update(dt);
    render();
  }

  resize();
  loadBackdrops();
  reset();
  hintEl.textContent = 'Loading Aztec photography…';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
