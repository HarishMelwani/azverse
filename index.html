<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azverse</title>
<style>
  :root {
    --chartreuse: #D4FF28;  /* primary */
    --orchid: #FF2DF4;      /* secondary */
    --aqua: #2BFAE9;
    --vermillion: #FF1A1A;
    --parchment: #F2EEE1;
    --ink: #1A1400;
    --malachite: #001F18;
    --aubergine: #2E0026;
    --lapis: #00122E;
    --oxblood: #2E0700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: monospace;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--lapis);
    border-left: 18px solid var(--chartreuse); /* medium border left */
    border-top: 6px solid var(--chartreuse);
    border-right: 6px solid var(--chartreuse);
    border-bottom: 6px solid var(--chartreuse);
    border-radius: 4px;
    box-sizing: border-box;
  }
  #hint {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; color: var(--chartreuse);
    text-shadow: 0 0 6px #000;
    pointer-events: none; min-height: 18px;
    background: rgba(26,20,0,0.65);
    padding: 4px 12px;
    border-radius: 4px;
    z-index: 20;
  }
  #hud {
    position: fixed;
    top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px;
    font-size: 13px; color: var(--parchment);
    gap: 12px;
    z-index: 30;
    pointer-events: none;
  }
  #hud .left { display: flex; align-items: center; gap: 8px; }
  #hud b { color: var(--chartreuse); }
  #hud img.logo { height: 22px; }
  #controls {
    position: fixed;
    bottom: 14px; left: 0; right: 0;
    font-size: 13px; color: #918b7f; text-align: center; line-height: 1.7;
    z-index: 30;
    pointer-events: none;
    text-shadow: 0 0 6px #000;
  }
  #controls kbd {
    background: var(--oxblood); border: 1px solid #804033; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 6px; font-size: 12px; color: var(--parchment);
  }
  #progress {
    position: fixed;
    bottom: 0; left: 18px; right: 6px;
    height: 4px; background: var(--oxblood);
    z-index: 30;
  }
  #progress i { display: block; height: 100%; width: 0%; background: var(--chartreuse); transition: width .3s; }

  /* ---- touch controls (mobile only) ---- */
  #touch-controls {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    display: none;
  }
  #touch-controls .tbtn {
    position: fixed;
    pointer-events: auto;
    touch-action: none;
    background: rgba(26,20,0,0.72);
    border: 2px solid var(--chartreuse);
    color: var(--chartreuse);
    font-family: monospace;
    font-weight: bold;
    border-radius: 14px;
    text-shadow: 0 0 6px #000;
    box-shadow: 0 0 14px rgba(212,255,40,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  #touch-controls .tbtn:active {
    background: var(--chartreuse);
    color: var(--ink);
  }
  #btn-left  { left: 14px;  bottom: 18px; width: 96px;  height: 96px;  font-size: 40px; }
  #btn-right { right: 14px; bottom: 18px; width: 96px;  height: 96px;  font-size: 40px; }
  #btn-jump  { right: 14px; bottom: 126px; width: 76px; height: 76px;  font-size: 13px; }
  #btn-enter { left: 14px;  bottom: 126px; width: 76px; height: 76px;  font-size: 12px; }

  @media (pointer: coarse), (max-width: 820px) {
    canvas {
      border-width: 6px;
    }
    #hud { font-size: 11px; padding: 0 10px; }
    #hud img.logo { height: 16px; }
    #controls { display: none; }
    #touch-controls { display: block; }
    #progress { left: 6px; right: 6px; }
    #hint { top: 40px; font-size: 12px; padding: 3px 10px; max-width: 92%; }
  }
</style>
</head>
<body>
  <div id="hud">
    <span class="left"><img class="logo" src="assets/logo/Aztec-Symbol-Circle.svg" alt="Aztec"> <b id="street-name">AZVERSE</b></span>
    <span>Visited <b id="visited">1</b> / 7</span>
    <span>Hint: ENTER to open a page</span>
  </div>
  <div id="progress"><i id="progress-bar"></i></div>
  <div id="wrap">
    <div id="hint"></div>
    <canvas id="game" width="960" height="520"></canvas>
  </div>
  <div id="controls">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> walk &nbsp;&nbsp;
    <kbd>SPACE</kbd> jump &nbsp;&nbsp;
    <kbd>ENTER</kbd> open page in new tab &nbsp;&nbsp;
    <kbd>M</kbd> minimap &nbsp;&nbsp; <kbd>P</kbd> pause
  </div>
  <div id="touch-controls">
    <button id="btn-left" class="tbtn" aria-label="Walk left">&#9664;</button>
    <button id="btn-jump" class="tbtn" aria-label="Jump">JUMP</button>
    <button id="btn-enter" class="tbtn" aria-label="Open page">OPEN</button>
    <button id="btn-right" class="tbtn" aria-label="Walk right">&#9654;</button>
  </div>

<script>
( () => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, GROUND, moonX;

  function resize() {
    const BORDER_L = 18, BORDER_O = 6; // medium left, small elsewhere
    W = window.innerWidth - BORDER_L - BORDER_O;
    H = window.innerHeight - BORDER_O * 2;
    canvas.width = W;
    canvas.height = H;
    GROUND = H - 70;
    moonX = W - 90;
    if (player) {
      player.y = GROUND - player.h;
      player.x = Math.max(30, Math.min(player.x, WORLD_W - 30));
    }
    if (cam !== undefined) cam = Math.max(0, Math.min(cam, WORLD_W - W));
  }
  window.addEventListener('resize', resize);

  const hintEl = document.getElementById('hint');
  const streetNameEl = document.getElementById('street-name');
  const visitedEl = document.getElementById('visited');

  // ---------- world / sites ----------
  const WORLD_W = 3500;

  const SITES = [
    { id: 'home',       name: 'aztec.network', x: 180,  width: 230, color: '#FF1A1A', label: 'Home',       url: 'https://aztec.network/',                     visited: true },
    { id: 'developers', name: '/developers',   x: 470,  width: 215, color: '#19534A', label: 'Developers', url: 'https://aztec.network/developers',          visited: false },
    { id: 'noir',       name: '/noir',         x: 760,  width: 195, color: '#80336A', label: 'Noir',       url: 'https://aztec.network/noir',                visited: false },
    { id: 'basics',     name: '/basics',       x: 1040, width: 195, color: '#335380', label: 'Basics',     url: 'https://aztec.network/basics',              visited: false },
    { id: 'network',    name: '/network',      x: 1330, width: 210, color: '#19958C', label: 'Network',    url: 'https://aztec.network/network',             visited: false },
    { id: 'alpha-v5',   name: '/alpha-v5',     x: 1620, width: 215, color: '#CC24C3', label: 'Alpha V5',   url: 'https://aztec.network/alpha-v5',            visited: false },
    { id: 'projects',   name: '/projects',     x: 1910, width: 210, color: '#FF5555', label: 'Projects',   url: 'https://aztec.network/projects',            visited: false },
    { id: 'blog',       name: '/blog',         x: 2200, width: 195, color: '#A9CC1F', label: 'Blog',       url: 'https://aztec.network/blog',                visited: false },
    { id: 'research',   name: '/research',     x: 2490, width: 215, color: '#29665F', label: 'Research',   url: 'https://aztec.network/research',            visited: false },
    { id: 'roadmap',    name: '/roadmap',      x: 2780, width: 210, color: '#FF6AEA', label: 'Roadmap',    url: 'https://aztec.network/roadmap',             visited: false },
    { id: 'github',     name: 'GitHub',        x: 3070, width: 215, color: '#564D3F', label: 'Source',     url: 'https://github.com/AztecProtocol',           visited: false },
  ];
  const SITE_COUNT = SITES.length;

  // ---------- backdrop images (Aztec brand photography) ----------
  const BG_COUNT = 30;
  const bgImages = [];
  let bgLoaded = 0, bgCur = 0, bgNext = 0;
  let bgFade = 1; // 1 = fully showing current
  const BG_SWITCH = 12; // seconds per image
  let bgTimer = BG_SWITCH;

  const logoImg = new Image();
  logoImg.src = 'assets/logo/Aztec-Symbol-Circle.svg';

  function loadBackdrops() {
    for (let i = 1; i <= BG_COUNT; i++) {
      const im = new Image();
      im.onload = () => { bgLoaded++; updateProgress(); };
      im.onerror = () => { bgLoaded++; updateProgress(); };
      im.src = 'assets/bg/img_' + String(i).padStart(2, '0') + '.jpg';
      bgImages.push(im);
    }
  }
  function updateProgress() {
    const bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = Math.round(bgLoaded / BG_COUNT * 100) + '%';
    if (bgLoaded >= BG_COUNT) hintEl.textContent = 'Welcome to Azverse — walk right to explore the site';
  }

  // ---------- state ----------
  let player, cam, keys, paused, minimap;
  let lastTime = 0;

  function reset() {
    player = {
      x: SITES[0].x + SITES[0].width / 2,
      y: GROUND - 34,
      vx: 0, vy: 0, w: 22, h: 44,
      facing: 1, walkPhase: 0, grounded: true,
    };
    cam = 0;
    keys = {};
    paused = false;
    minimap = true;
    SITES.forEach(s => s.visited = s.id === 'home');
    updateHUD();
  }

  function updateHUD() {
    const n = SITES.filter(s => s.visited).length;
    visitedEl.textContent = n + ' / ' + SITE_COUNT;
    streetNameEl.textContent = 'AZVERSE';
  }

  // ---------- input ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    keys[k] = true;
    if (k === 'Enter') { e.preventDefault(); tryEnter(); }
    if (k === 'p' || k === 'P') { paused = !paused; hintEl.textContent = paused ? 'PAUSED' : ''; }
    if (k === 'm' || k === 'M') { minimap = !minimap; }
    if (k === ' ' || k === 'Space') {
      e.preventDefault();
      if (player.grounded) { player.vy = -9.5; player.grounded = false; }
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // ---------- touch controls (mobile) ----------
  function bindHold(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, { passive: false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); keys[key] = false; }, { passive: false });
    el.addEventListener('touchcancel',() => { keys[key] = false; });
    el.addEventListener('mousedown', () => { keys[key] = true; });
    el.addEventListener('mouseup',   () => { keys[key] = false; });
    el.addEventListener('mouseleave',() => { keys[key] = false; });
  }
  bindHold('btn-left', 'ArrowLeft');
  bindHold('btn-right', 'ArrowRight');

  function bindTap(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.preventDefault(); fn(); });
  }
  bindTap('btn-jump', () => {
    if (player.grounded) { player.vy = -9.5; player.grounded = false; }
  });
  bindTap('btn-enter', () => tryEnter());

  function tryEnter() {
    const s = siteAt(player.x);
    if (!s) { hintEl.textContent = 'Nothing here... walk to a building door.'; return; }
    openPage(s);
  }

  function openPage(s) {
    s.visited = true;
    updateHUD();
    hintEl.textContent = 'Opening ' + s.url + ' in a new tab...';
    window.open(s.url, '_blank', 'noopener');
  }

  // ---------- helpers ----------
  function siteAt(x) {
    return SITES.find(s => Math.abs(x - (s.x + s.width / 2)) < s.width / 2 + 6) || null;
  }

  function nearDoor(s) {
    const doorX = s.x + s.width / 2;
    return Math.abs(player.x - doorX) < 26 && player.grounded;
  }

  // ---------- update ----------
  function update(dt) {
    const accel = 0.55, maxSpeed = 4.2;
    let dir = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dir += 1;
    if (dir !== 0) { player.facing = dir; player.walkPhase += dt * 12; }

    player.vx += dir * accel;
    player.vx *= 0.82;
    if (Math.abs(player.vx) > maxSpeed) player.vx = Math.sign(player.vx) * maxSpeed;
    player.x += player.vx;
    player.y += player.vy;
    player.vy += 0.45;

    if (player.x < 30) { player.x = 30; player.vx = 0; }
    if (player.x > WORLD_W - 30) { player.x = WORLD_W - 30; player.vx = 0; }

    if (player.y >= GROUND - player.h) {
      player.y = GROUND - player.h;
      player.vy = 0;
      player.grounded = true;
    } else {
      player.grounded = false;
    }

    // camera
    const target = player.x - W * 0.42;
    cam += (target - cam) * 0.08;
    cam = Math.max(0, Math.min(cam, WORLD_W - W));

    // door hint
    let s = siteAt(player.x);
    if (s && nearDoor(s)) {
      hintEl.textContent = 'Press ENTER to open ' + s.url;
    } else {
      hintEl.textContent = '';
    }
  }

  // ---------- drawing ----------
  function drawBackdrop() {
    const cur = bgImages[bgCur];
    const nxt = bgImages[bgNext];
    if (cur && cur.complete && cur.naturalWidth) {
      // cover-fit current image
      ctx.globalAlpha = 1;
      drawCover(cur, 0);
      if (nxt && nxt !== cur && nxt.complete && nxt.naturalWidth && bgFade < 1) {
        ctx.globalAlpha = 1 - bgFade;
        drawCover(nxt, 0);
      }
      ctx.globalAlpha = 1;
    } else {
      // fallback gradient while loading
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0d22');
      g.addColorStop(1, '#1c254a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    // brand tint: chartreuse-on-ink wash so the street stays readable
    ctx.fillStyle = 'rgba(26,20,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    // vignette at bottom for street legibility
    const vg = ctx.createLinearGradient(0, GROUND - 160, 0, H);
    vg.addColorStop(0, 'rgba(26,20,0,0)');
    vg.addColorStop(1, 'rgba(26,20,0,0.9)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, GROUND - 160, W, H - (GROUND - 160));
  }

  function drawCover(img, offsetX) {
    const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, offsetX, (H - dh) / 2, dw, dh);
  }

  function drawSkyline(par, height, color) {
    ctx.fillStyle = color;
    let x = -((cam * par) % 140);
    for (let i = 0; i < 12; i++) {
      const bw = 60 + ((i * 53) % 70);
      const bh = height * (0.5 + ((i * 37) % 50) / 100);
      ctx.fillRect(x, GROUND - bh, bw, bh);
      x += 140;
    }
  }

  function drawBuildings() {
    for (const s of SITES) {
      const sx = s.x - cam;
      if (sx + s.width < -50 || sx > W + 50) continue;
      const height = Math.min(GROUND - 40, 240 + ((s.x * 7) % 90));

      // building body
      ctx.fillStyle = s.color;
      ctx.fillRect(sx, GROUND - height, s.width, height);
      // roof
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(sx, GROUND - height, s.width, 8);
      // windows
      ctx.fillStyle = 'rgba(212,255,40,0.28)';
      for (let wy = GROUND - height + 20; wy < GROUND - 90; wy += 24) {
        for (let wx = sx + 14; wx < sx + s.width - 18; wx += 26) {
          if (((wx + wy * 3) % 5) !== 0) ctx.fillRect(wx, wy, 10, 14);
        }
      }
      // sign
      ctx.fillStyle = '#1A1400';
      const sw = s.name.length * 8 + 20;
      const sh = 26;
      ctx.fillRect(sx + s.width / 2 - sw / 2, GROUND - height + 14, sw, sh);
      ctx.strokeStyle = 'rgba(212,255,40,0.6)';
      ctx.lineWidth = 1;
      ctx.strokeRect(sx + s.width / 2 - sw / 2, GROUND - height + 14, sw, sh);
      ctx.fillStyle = '#D4FF28';
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      // draw the Aztec symbol logo on the home building sign
      if (s.id === 'home' && logoImg.complete && logoImg.naturalWidth) {
        ctx.drawImage(logoImg, sx + s.width / 2 - sw / 2 + 5, GROUND - height + 17, 20, 20);
        ctx.fillText(s.name, sx + s.width / 2 + 14, GROUND - height + 31);
      } else {
        ctx.fillText(s.name, sx + s.width / 2, GROUND - height + 31);
      }

      // door
      const dx = sx + s.width / 2;
      ctx.fillStyle = '#1A1400';
      ctx.fillRect(dx - 14, GROUND - 40, 28, 40);
      ctx.fillStyle = s.color;
      ctx.fillRect(dx - 8, GROUND - 34, 6, 34);
      ctx.fillRect(dx + 2, GROUND - 34, 6, 34);
      // lamp above door
      if (s.visited) {
        ctx.fillStyle = '#D4FF28';
        ctx.shadowColor = '#D4FF28';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(dx, GROUND - 50, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.textAlign = 'left';
    }
  }

  function drawLamps() {
    ctx.fillStyle = '#2E0700';
    for (let lx = 60; lx < WORLD_W; lx += 220) {
      const sx = lx - cam;
      if (sx < -30 || sx > W + 30) continue;
      ctx.fillRect(sx, GROUND - 110, 5, 110);
      ctx.fillStyle = '#D4FF28';
      ctx.shadowColor = '#D4FF28';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(sx + 2, GROUND - 114, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#2E0700';
    }
  }

  function drawMaskedMan() {
    const p = player;
    const px = p.x - cam;
    const py = p.y;
    const f = p.facing;
    const walk = player.grounded ? Math.sin(p.walkPhase) * 3 : 0;

    ctx.save();
    ctx.translate(px, py);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, p.h + 2, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs
    ctx.strokeStyle = '#470B00';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4, p.h - 16);
    ctx.lineTo(-4 + walk * 0.5, p.h);
    ctx.moveTo(4, p.h - 16);
    ctx.lineTo(4 - walk * 0.5, p.h);
    ctx.stroke();

    // body (dark hoodie)
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.roundRect(-p.w / 2, p.h - 40, p.w, 26, 6);
    ctx.fill();
    // hoodie pocket line
    ctx.strokeStyle = '#D4FF28';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, p.h - 18);
    ctx.lineTo(4, p.h - 18);
    ctx.stroke();

    // head under hood
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.arc(0, p.h - 44, 11, Math.PI, 0);
    ctx.fill();
    // hood peak
    ctx.fillStyle = '#2E0700';
    ctx.beginPath();
    ctx.moveTo(-11, p.h - 46);
    ctx.quadraticCurveTo(0, p.h - 62, 11, p.h - 46);
    ctx.closePath();
    ctx.fill();

    // chartreuse mask
    ctx.fillStyle = '#D4FF28';
    ctx.beginPath();
    ctx.ellipse(f * 1, p.h - 45, 8.5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // eye holes
    ctx.fillStyle = '#1A1400';
    ctx.beginPath();
    ctx.ellipse(f * 3, p.h - 46, 3.4, 4.4, f * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(f * -2, p.h - 46, 3.4, 4.4, f * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // mask edge (chin)
    ctx.strokeStyle = '#E1FF8C';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(f * 1, p.h - 44, 8.5, 0.3, Math.PI - 0.3);
    ctx.stroke();

    ctx.restore();
  }

  function drawStreet() {
    // sidewalk
    ctx.fillStyle = '#3a3426';
    ctx.fillRect(0, GROUND - 4, W, 4);
    // pavement
    ctx.fillStyle = '#1A1400';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    // lane lines
    ctx.strokeStyle = '#564D3F';
    ctx.lineWidth = 3;
    ctx.setLineDash([22, 18]);
    ctx.beginPath();
    ctx.moveTo(-(cam % 40), GROUND + 30);
    ctx.lineTo(W + 40, GROUND + 30);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawMinimap() {
    if (!minimap) return;
    const mw = W - 40, mh = 26, mx = 20, my = H - 34;
    ctx.fillStyle = 'rgba(26,20,0,0.85)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = 'rgba(212,255,40,0.5)';
    ctx.strokeRect(mx, my, mw, mh);
    const scale = mw / WORLD_W;
    for (const s of SITES) {
      const bx = mx + s.x * scale;
      ctx.fillStyle = s.visited ? '#D4FF28' : '#918B7F';
      ctx.beginPath();
      ctx.arc(bx, my + mh / 2, s.visited ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // player
    ctx.fillStyle = '#FF2DF4';
    ctx.beginPath();
    ctx.arc(mx + player.x * scale, my + mh / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    drawBackdrop();
    drawBuildings();
    drawLamps();
    drawStreet();
    drawMaskedMan();
    drawMinimap();
  }

  // ---------- backdrop switching ----------
  function tickBackdrop(dt) {
    if (bgLoaded < 2) return;
    bgTimer -= dt;
    if (bgTimer <= 0) {
      bgTimer = BG_SWITCH;
      bgCur = bgNext;
      bgNext = (bgNext + 1) % BG_COUNT;
      bgFade = 0;
    }
    if (bgFade < 1) bgFade = Math.min(1, bgFade + dt / 1.2);
  }

  // ---------- loop ----------
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;
    tickBackdrop(dt);
    if (!paused) update(dt);
    render();
  }

  resize();
  loadBackdrops();
  reset();
  hintEl.textContent = 'Loading Aztec photography…';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
